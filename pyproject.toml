[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivado-mcp"
version = "0.3.1"
description = "MCP server for AMD/Xilinx Vivado + Red Pitaya FPGA development - enables AI assistants to drive synthesis, implementation, and on-board deployment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "sinemortal"}
]
keywords = ["mcp", "vivado", "fpga", "xilinx", "amd", "red-pitaya", "zynq", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "psutil>=5.9.0",
    "paramiko>=3.0.0",
    "pexpect>=4.8.0; sys_platform != 'win32'",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
]

[project.scripts]
vivado-mcp = "vivado_mcp:main"

[project.urls]
Homepage = "https://github.com/sinemortal/vivado-mcp"
Repository = "https://github.com/sinemortal/vivado-mcp"
Issues = "https://github.com/sinemortal/vivado-mcp/issues"

# Since the repo root is the package itself, we map the package name to "."
[tool.setuptools]
packages = ["vivado_mcp", "vivado_mcp.tools"]
package-dir = {"vivado_mcp" = ".", "vivado_mcp.tools" = "tools"}

# Include data files (board XDC, bundled docs, feature requests log)
[tool.setuptools.package-data]
vivado_mcp = [
    "data/*.json",
    "data/boards/*.json",
    "data/boards/*.xdc",
    "data/docs/*.md",
]
