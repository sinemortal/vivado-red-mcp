[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivado-red-mcp"
version = "0.5.0"
description = "MCP server that lets AI assistants drive AMD Vivado (projects, block design, synthesis, implementation, simulation, reports) with first-class Red Pitaya STEMlab 125-14 support (RTL and PS+PL builds, SSH deploy)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "sinemortal"}
]
keywords = ["mcp", "vivado", "fpga", "xilinx", "amd", "red-pitaya", "zynq", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "psutil>=5.9.0",
    "paramiko>=3.0.0",
    "pexpect>=4.8.0; sys_platform != 'win32'",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
]

[project.scripts]
vivado-red-mcp = "vivado_red_mcp:main"

[project.urls]
Homepage = "https://github.com/sinemortal/vivado-red-mcp"
Repository = "https://github.com/sinemortal/vivado-red-mcp"
Issues = "https://github.com/sinemortal/vivado-red-mcp/issues"

# Since the repo root is the package itself, we map the package name to "."
[tool.setuptools]
packages = ["vivado_red_mcp", "vivado_red_mcp.tools"]
package-dir = {"vivado_red_mcp" = ".", "vivado_red_mcp.tools" = "tools"}

# Include data files (board XDC, bundled docs, feature requests log)
[tool.setuptools.package-data]
vivado_red_mcp = [
    "data/*.json",
    "data/boards/*.json",
    "data/boards/*.xdc",
    "data/docs/*.md",
]
